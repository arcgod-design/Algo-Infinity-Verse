<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neutrino Communication Array | Algo Infinity Verse</title>
    <link rel="stylesheet" href="/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Monaco Editor -->
    <script src="https://unpkg.com/monaco-editor@0.36.1/min/vs/loader.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; font-family: 'Poppins', sans-serif; color: #fff; }
      .app-container { display: flex; height: 100vh; }
      
      .sidebar { width: 450px; background: rgba(15, 23, 42, 0.95); border-right: 1px solid #0ea5e9; display: flex; flex-direction: column; z-index: 10; }
      .header { padding: 20px; border-bottom: 1px solid #334155; }
      .header h2 { margin: 0; color: #0ea5e9; font-family: 'Orbitron', sans-serif; font-size: 1.2rem; }
      .header p { margin: 5px 0 0 0; font-size: 0.8rem; color: #94a3b8; }
      
      #editor-container { flex: 1; min-height: 300px; }
      
      .controls { padding: 20px; border-top: 1px solid #334155; background: rgba(0,0,0,0.5); }
      .btn { background: linear-gradient(90deg, #0284c7, #0369a1); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
      .btn:hover { background: #0ea5e9; transform: translateY(-2px); box-shadow: 0 0 15px rgba(14, 165, 233, 0.5); }
      
      .sim-container { flex: 1; position: relative; background: #000; overflow: hidden; }
      canvas { width: 100%; height: 100%; display: block; filter: contrast(1.1); }
      
      .hud { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #0ea5e9; width: 280px; z-index: 10; pointer-events: none; }
      .hud h3 { margin: 0 0 10px 0; color: #0ea5e9; font-size: 1rem; font-family: 'Orbitron', sans-serif; }
      .metric { display: flex; justify-content: space-between; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 5px; }
      .val { font-weight: bold; font-family: monospace; }
      .val-noise { color: #ef4444; }
      .val-sig { color: #10b981; }
    </style>
  </head>
  <body>
    
    <div class="app-container">
      <div class="sidebar">
        <div class="header">
          <h2><i class="fas fa-satellite"></i> Project Sub-Terra</h2>
          <p>Neutrino Core Communication</p>
        </div>
        
        <div id="editor-container"></div>
        
        <div class="controls">
          <button class="btn" onclick="fireNeutrinos()"><i class="fas fa-bolt"></i> Fire Neutrino Beam</button>
        </div>
      </div>
      
      <div class="sim-container">
        
        <canvas id="beamCanvas" style="position: relative; z-index: 1;"></canvas>
        
        <div class="hud">
          <h3>Beam Telemetry</h3>
          <div class="metric"><span>Beam Coherence:</span> <span class="val val-sig" id="cohVal">100%</span></div>
          <div class="metric"><span>Core Scattering:</span> <span class="val val-noise" id="scatVal">0%</span></div>
          <div class="metric"><span>Depth:</span> <span class="val" id="depthVal" style="color:#facc15">0 km</span></div>
          <div class="metric" style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 5px;">
            <span>Transmission:</span> <span class="val" id="statusVal" style="color:#94a3b8">STANDBY</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      let editor;
      require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@0.36.1/min/vs' }});
      require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('editor-container'), {
          value: `// Neutrino Beam Modulation Algorithm
// You are firing a beam of neutrinos straight through a planet to a receiver on the other side.
// The crust is thin, but the iron core is dense and causes neutrino scattering (noise).
// You must modulate the frequency of the beam based on depth/density to maintain coherence.

function modulateBeam(depth, currentDensity) {
    // Return { frequency: float (0.1 to 10.0) }
    // Low frequency penetrates dense core better, but reduces overall signal coherence.
    // High frequency maintains coherence but scatters heavily in dense core.
    
    // Naive logic: Full frequency all the time!
    // Result: The beam scatters instantly in the core and turns into noise.
    
    return {
        frequency: 10.0
    };
}`,
          language: 'javascript',
          theme: 'vs-dark',
          minimap: { enabled: false },
          automaticLayout: true
        });
      });

      const canvas = document.getElementById('beamCanvas');
      const ctx = canvas.getContext('2d');
      
      let isSimulating = false;
      let depth = 0; // 0 to 100 (where 50 is center of planet)
      let coherence = 100;
      let scattering = 0;
      let time = 0;
      
      let particleHistory = [];
      
      function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
      window.addEventListener('resize', resize);
      resize();

      function getDensityAtDepth(d) {
          // Crust (0-20), Mantle (20-40), Core (40-60), Mantle (60-80), Crust (80-100)
          let distFromCenter = Math.abs(50 - d);
          if (distFromCenter < 10) return 100; // Inner Core
          if (distFromCenter < 20) return 80; // Outer Core
          if (distFromCenter < 40) return 30; // Mantle
          return 5; // Crust
      }

      function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let cx = canvas.width / 2;
          let cy = canvas.height / 2;
          
          let planetRadius = Math.min(cx, cy) * 0.9;
          
          // Draw Planet Layers
          ctx.beginPath(); ctx.arc(cx, cy, planetRadius, 0, Math.PI*2);
          ctx.fillStyle = '#1e293b'; ctx.fill(); // Crust
          
          ctx.beginPath(); ctx.arc(cx, cy, planetRadius * 0.8, 0, Math.PI*2);
          ctx.fillStyle = '#78350f'; ctx.fill(); // Mantle
          
          ctx.beginPath(); ctx.arc(cx, cy, planetRadius * 0.4, 0, Math.PI*2);
          ctx.fillStyle = '#ea580c'; ctx.fill(); // Outer Core
          
          ctx.beginPath(); ctx.arc(cx, cy, planetRadius * 0.2, 0, Math.PI*2);
          ctx.fillStyle = '#fef08a'; ctx.fill(); // Inner Core

          if (isSimulating) {
              time += 0.1;
              depth += 0.2; // Move through planet
              
              let density = getDensityAtDepth(depth);
              let freq = 5.0;
              
              try {
                  eval(editor.getValue());
                  let res = modulateBeam(depth, density);
                  if (res && res.frequency !== undefined) {
                      freq = Math.max(0.1, Math.min(10.0, res.frequency));
                  }
              } catch(e) {}
              
              // Physics Evaluation
              // High density requires low frequency to prevent scatter
              // High frequency in high density = massive scatter loss
              // Low frequency in low density = slow coherence decay
              
              let scatterFactor = (freq * density) / 100; 
              if (scatterFactor > 2.0) {
                  scattering += (scatterFactor * 2);
                  coherence -= (scatterFactor * 2);
              } else {
                  // Natural coherence decay if frequency is too low
                  if (freq < 3.0) coherence -= (0.5 / freq);
                  scattering -= 1.0;
              }
              
              if (scattering < 0) scattering = 0;
              if (scattering > 100) scattering = 100;
              if (coherence < 0) coherence = 0;
              
              // End States
              if (coherence <= 0) {
                  isSimulating = false;
                  document.getElementById('statusVal').innerText = "SIGNAL LOST (DECOHERENCE)";
                  document.getElementById('statusVal').style.color = "#ef4444";
              } else if (scattering >= 100) {
                  isSimulating = false;
                  document.getElementById('statusVal').innerText = "SIGNAL SCATTERED (CRITICAL NOISE)";
                  document.getElementById('statusVal').style.color = "#ef4444";
              } else if (depth >= 100) {
                  isSimulating = false;
                  document.getElementById('statusVal').innerText = "TRANSMISSION SUCCESSFUL!";
                  document.getElementById('statusVal').style.color = "#10b981";
              } else {
                  if (scattering > 60) {
                      document.getElementById('statusVal').innerText = "WARNING: HIGH SCATTERING";
                      document.getElementById('statusVal').style.color = "#f97316";
                  } else {
                      document.getElementById('statusVal').innerText = "TRANSMITTING...";
                      document.getElementById('statusVal').style.color = "#0ea5e9";
                  }
              }
              
              // HUD
              let cohEl = document.getElementById('cohVal');
              cohEl.innerText = coherence.toFixed(1) + "%";
              if (coherence < 40) cohEl.style.color = "#ef4444";
              else if (coherence < 70) cohEl.style.color = "#facc15";
              else cohEl.style.color = "#10b981";
              
              let scatEl = document.getElementById('scatVal');
              scatEl.innerText = scattering.toFixed(1) + "%";
              if (scattering > 60) scatEl.style.color = "#ef4444";
              else if (scattering > 30) scatEl.style.color = "#facc15";
              else scatEl.style.color = "#cbd5e1";
              
              document.getElementById('depthVal').innerText = Math.floor(depth * 127) + " km";
              
              // Record history for drawing beam
              particleHistory.push({
                  d: depth,
                  freq: freq,
                  scatter: scattering
              });
          }
          
          // Draw the beam
          if (particleHistory.length > 0) {
              let startX = cx - planetRadius - 50; // Transmitter
              let endX = cx + planetRadius + 50;   // Receiver
              
              // Transmitter
              ctx.fillStyle = '#0ea5e9';
              ctx.fillRect(startX - 20, cy - 10, 20, 20);
              // Receiver
              ctx.fillStyle = '#10b981';
              ctx.fillRect(endX, cy - 10, 20, 20);
              
              ctx.beginPath();
              for(let i=0; i<particleHistory.length; i++) {
                  let p = particleHistory[i];
                  let x = startX + (p.d / 100) * (endX - startX);
                  
                  // Sine wave based on frequency
                  // Noise based on scatter
                  let noise = (Math.random() - 0.5) * p.scatter;
                  let y = cy + Math.sin(time*2 + i * (p.freq*0.1)) * 20 + noise;
                  
                  if (i === 0) ctx.moveTo(x, y);
                  else ctx.lineTo(x, y);
              }
              
              ctx.strokeStyle = coherence > 50 ? 'rgba(14, 165, 233, 0.8)' : 'rgba(239, 68, 68, 0.8)';
              ctx.lineWidth = 3;
              ctx.shadowBlur = 10;
              ctx.shadowColor = ctx.strokeStyle;
              ctx.stroke();
              ctx.shadowBlur = 0;
              
              // If scattered heavily, draw loose particles
              if (scattering > 20) {
                  ctx.fillStyle = 'rgba(239, 68, 68, 0.5)';
                  let latest = particleHistory[particleHistory.length-1];
                  let currX = startX + (latest.d / 100) * (endX - startX);
                  for(let k=0; k<scattering; k++) {
                      ctx.beginPath();
                      ctx.arc(currX + (Math.random()-0.5)*100, cy + (Math.random()-0.5)*200, 2, 0, Math.PI*2);
                      ctx.fill();
                  }
              }
          }

          requestAnimationFrame(animate);
      }
      
      animate();

      function fireNeutrinos() {
          if(isSimulating) return;
          isSimulating = true;
          time = 0;
          depth = 0;
          coherence = 100;
          scattering = 0;
          particleHistory = [];
          
          document.getElementById('statusVal').innerText = "BEAM ACTIVATED...";
          document.getElementById('statusVal').style.color = "#0ea5e9";
      }
    </script>
  </body>
</html>
