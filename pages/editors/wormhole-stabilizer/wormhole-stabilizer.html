<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wormhole Topological Stabilizer | Algo Infinity Verse</title>
    <link rel="stylesheet" href="/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Monaco Editor -->
    <script src="https://unpkg.com/monaco-editor@0.36.1/min/vs/loader.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; font-family: 'Poppins', sans-serif; color: #fff; }
      .app-container { display: flex; height: 100vh; }
      
      .sidebar { width: 450px; background: rgba(15, 23, 42, 0.95); border-right: 1px solid #ec4899; display: flex; flex-direction: column; z-index: 10; }
      .header { padding: 20px; border-bottom: 1px solid #334155; }
      .header h2 { margin: 0; color: #ec4899; font-family: 'Orbitron', sans-serif; font-size: 1.2rem; }
      .header p { margin: 5px 0 0 0; font-size: 0.8rem; color: #94a3b8; }
      
      #editor-container { flex: 1; min-height: 300px; }
      
      .controls { padding: 20px; border-top: 1px solid #334155; background: rgba(0,0,0,0.5); }
      .btn { background: linear-gradient(90deg, #db2777, #be185d); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
      .btn:hover { background: #ec4899; transform: translateY(-2px); box-shadow: 0 0 15px rgba(236, 72, 153, 0.5); }
      
      .sim-container { flex: 1; position: relative; background: radial-gradient(circle at center, #312e81 0%, #000 100%); overflow: hidden; perspective: 1000px; }
      canvas { width: 100%; height: 100%; display: block; filter: brightness(1.2); }
      
      .hud { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #ec4899; width: 300px; z-index: 10; pointer-events: none; }
      .hud h3 { margin: 0 0 10px 0; color: #ec4899; font-size: 1rem; font-family: 'Orbitron', sans-serif; }
      .metric { display: flex; justify-content: space-between; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 5px; }
      .val { font-weight: bold; font-family: monospace; }
      .val-tensor { color: #facc15; }
      .val-ships { color: #38bdf8; }
    </style>
  </head>
  <body>
    
    <div class="app-container">
      <div class="sidebar">
        <div class="header">
          <h2><i class="fas fa-black-tie"></i> Einstein-Rosen Bridge</h2>
          <p>Exotic Matter Tensor Injection</p>
        </div>
        
        <div id="editor-container"></div>
        
        <div class="controls">
          <button class="btn" onclick="openWormhole()"><i class="fas fa-door-open"></i> Rip Spacetime</button>
        </div>
      </div>
      
      <div class="sim-container">
        <!-- Spacetime Grid -->
        <div id="gridBg" style="position: absolute; inset:0; background: 
            linear-gradient(rgba(236, 72, 153, 0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(236, 72, 153, 0.1) 1px, transparent 1px);
            background-size: 40px 40px; pointer-events: none; z-index: 0; transform-origin: center; transform: rotateX(60deg); opacity: 0;"></div>
            
        <canvas id="wormholeCanvas" style="position: relative; z-index: 1;"></canvas>
        
        <div class="hud">
          <h3>Topological Telemetry</h3>
          <div class="metric"><span>Throat Diameter:</span> <span class="val" id="diamVal" style="color:#f472b6">0 km</span></div>
          <div class="metric"><span>Gravitational Shear:</span> <span class="val val-tensor" id="shearVal">0 G</span></div>
          <div class="metric"><span>Fleet Transit:</span> <span class="val val-ships" id="shipsVal">0 / 10</span></div>
          <div class="metric" style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 5px;">
            <span>Bridge Status:</span> <span class="val" id="statusVal" style="color:#94a3b8">CLOSED</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      let editor;
      require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@0.36.1/min/vs' }});
      require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('editor-container'), {
          value: `// Wormhole Stabilizer Algorithm
// The throat naturally collapses due to immense positive mass/gravity.
// You must inject Exotic Matter (Negative Energy) to hold it open.
// Warning: Too much exotic matter will cause the wormhole to expand uncontrollably and tear the fabric of spacetime!

function calculateExoticInjection(throatDiameter, gravitationalShear) {
    // Return a float representing the amount of negative energy to inject.
    // Negative energy expands the throat, positive gravity (shear) collapses it.
    
    // Naive logic: Pump infinite exotic matter!
    // Result: Spacetime ruptures in a vacuum decay event.
    
    return 1000.0;
}`,
          language: 'javascript',
          theme: 'vs-dark',
          minimap: { enabled: false },
          automaticLayout: true
        });
      });

      const canvas = document.getElementById('wormholeCanvas');
      const ctx = canvas.getContext('2d');
      
      let isSimulating = false;
      let time = 0;
      
      let diameter = 0;
      let shear = 0;
      let shipsPassed = 0;
      
      let fleet = [];
      
      function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
      window.addEventListener('resize', resize);
      resize();

      function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let cx = canvas.width / 2;
          let cy = canvas.height / 2;

          if (isSimulating) {
              time += 0.05;
              
              // Physics
              // Natural collapse (gravity tries to close it)
              shear = 50 + (1000 / Math.max(10, diameter)) + Math.sin(time)*20; // Shear gets worse as it gets smaller
              
              let injection = 0;
              try {
                  eval(editor.getValue());
                  let res = calculateExoticInjection(diameter, shear);
                  if (typeof res === 'number') {
                      injection = res;
                  }
              } catch(e) {}
              
              // Update diameter
              // Gravity shrinks it, injection expands it.
              let netForce = (injection * 0.1) - (shear * 0.05);
              diameter += netForce;
              
              // Move fleet
              if (diameter > 150) {
                  // Ships can only enter if diameter is wide enough
                  for(let i=0; i<fleet.length; i++) {
                      let s = fleet[i];
                      if (!s.passed) {
                          s.dist -= 2;
                          if (s.dist < 0) {
                              s.passed = true;
                              shipsPassed++;
                          }
                          break; // One at a time
                      }
                  }
              }
              
              // End conditions
              if (diameter <= 0) {
                  diameter = 0;
                  isSimulating = false;
                  document.getElementById('statusVal').innerText = "THROAT COLLAPSED (SPAGHETTIFICATION)";
                  document.getElementById('statusVal').style.color = "#ef4444";
                  document.getElementById('gridBg').style.opacity = 0;
              } else if (diameter > 800) {
                  isSimulating = false;
                  document.getElementById('statusVal').innerText = "SPACETIME RUPTURE (VACUUM DECAY)";
                  document.getElementById('statusVal').style.color = "#ef4444";
                  
                  ctx.fillStyle = '#fff';
                  ctx.fillRect(0,0,canvas.width, canvas.height);
              } else if (shipsPassed >= 10) {
                  isSimulating = false;
                  document.getElementById('statusVal').innerText = "FLEET TRANSIT COMPLETE";
                  document.getElementById('statusVal').style.color = "#10b981";
              } else {
                  if (diameter < 100) {
                      document.getElementById('statusVal').innerText = "WARNING: GRAVITATIONAL PINCH";
                      document.getElementById('statusVal').style.color = "#facc15";
                  } else {
                      document.getElementById('statusVal').innerText = "WORMHOLE STABLE";
                      document.getElementById('statusVal').style.color = "#ec4899";
                  }
              }
              
              // HUD Updates
              document.getElementById('diamVal').innerText = Math.floor(diameter) + " km";
              document.getElementById('shearVal').innerText = Math.floor(shear) + " G";
              document.getElementById('shipsVal').innerText = shipsPassed + " / 10";
              
              // Grid visual effect
              if(diameter > 0) {
                  document.getElementById('gridBg').style.opacity = Math.min(1.0, diameter/200);
                  // "Suck in" animation using background position
                  document.getElementById('gridBg').style.backgroundPosition = \`0px \${time * 100}px\`;
              }
          }
          
          // Draw Wormhole Visuals
          if (diameter > 0 && diameter < 800) {
              // The event horizon / throat
              let grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, diameter/2);
              grad.addColorStop(0, '#000');
              grad.addColorStop(0.8, 'rgba(88, 28, 135, 0.8)');
              grad.addColorStop(1, 'rgba(236, 72, 153, 0)');
              
              ctx.fillStyle = grad;
              ctx.beginPath(); ctx.arc(cx, cy, diameter/2 + 50, 0, Math.PI*2); ctx.fill();
              
              // Photon sphere (light orbiting)
              ctx.strokeStyle = 'rgba(236, 72, 153, 0.8)';
              ctx.lineWidth = 2 + Math.sin(time*10)*2;
              ctx.beginPath(); ctx.arc(cx, cy, diameter/2, 0, Math.PI*2); ctx.stroke();
              
              // Accretion disk / exotic matter swirl
              for(let i=0; i<10; i++) {
                  ctx.strokeStyle = \`rgba(244, 114, 182, \${0.1 + (i*0.05)})\`;
                  ctx.lineWidth = 1;
                  ctx.beginPath();
                  ctx.ellipse(cx, cy, (diameter/2) + i*15 + (Math.sin(time*2+i)*5), (diameter/4) + i*5, time*0.5, 0, Math.PI*2);
                  ctx.stroke();
              }
          }

          // Draw Fleet
          ctx.fillStyle = '#38bdf8';
          for(let i=0; i<fleet.length; i++) {
              let s = fleet[i];
              if (!s.passed) {
                  // Draw approaching wormhole
                  let sx = cx + s.dist; // Approach from right
                  let sy = cy;
                  
                  // Scale down as they get closer (falling in)
                  let scale = Math.max(0, s.dist / 300);
                  
                  if (scale > 0) {
                      ctx.beginPath();
                      ctx.moveTo(sx, sy - 5*scale);
                      ctx.lineTo(sx - 15*scale, sy);
                      ctx.lineTo(sx, sy + 5*scale);
                      ctx.fill();
                  }
              }
          }

          requestAnimationFrame(animate);
      }
      
      animate();

      function openWormhole() {
          if(isSimulating) return;
          isSimulating = true;
          time = 0;
          diameter = 20; // Initial small rip
          shear = 100;
          shipsPassed = 0;
          
          fleet = [];
          for(let i=0; i<10; i++) {
              fleet.push({ dist: 300 + (i*40), passed: false });
          }
          
          document.getElementById('statusVal').innerText = "RIPPING SPACETIME...";
          document.getElementById('statusVal').style.color = "#ec4899";
      }
    </script>
  </body>
</html>
