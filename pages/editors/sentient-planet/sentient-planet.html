<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentient Planetary Mind Interface | Algo Infinity Verse</title>
    <link rel="stylesheet" href="/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Monaco Editor -->
    <script src="https://unpkg.com/monaco-editor@0.36.1/min/vs/loader.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; font-family: 'Poppins', sans-serif; color: #fff; }
      .app-container { display: flex; height: 100vh; }
      
      .sidebar { width: 450px; background: rgba(15, 23, 42, 0.95); border-right: 1px solid #14b8a6; display: flex; flex-direction: column; z-index: 10; }
      .header { padding: 20px; border-bottom: 1px solid #334155; }
      .header h2 { margin: 0; color: #14b8a6; font-family: 'Orbitron', sans-serif; font-size: 1.2rem; }
      .header p { margin: 5px 0 0 0; font-size: 0.8rem; color: #94a3b8; }
      
      #editor-container { flex: 1; min-height: 300px; }
      
      .controls { padding: 20px; border-top: 1px solid #334155; background: rgba(0,0,0,0.5); }
      .btn { background: linear-gradient(90deg, #0d9488, #0f766e); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
      .btn:hover { background: #14b8a6; transform: translateY(-2px); box-shadow: 0 0 15px rgba(20, 184, 166, 0.5); }
      
      .sim-container { flex: 1; position: relative; background: radial-gradient(circle at center, #064e3b 0%, #020617 100%); overflow: hidden; }
      canvas { width: 100%; height: 100%; display: block; filter: contrast(1.1); }
      
      .hud { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #14b8a6; width: 300px; z-index: 10; pointer-events: none; }
      .hud h3 { margin: 0 0 10px 0; color: #14b8a6; font-size: 1rem; font-family: 'Orbitron', sans-serif; }
      .metric { display: flex; justify-content: space-between; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 5px; }
      .val { font-weight: bold; font-family: monospace; }
      .val-aggro { color: #ef4444; }
      .val-sync { color: #10b981; }
    </style>
  </head>
  <body>
    
    <div class="app-container">
      <div class="sidebar">
        <div class="header">
          <h2><i class="fas fa-brain"></i> Project Gaia</h2>
          <p>Sentient Planet Neural Translator</p>
        </div>
        
        <div id="editor-container"></div>
        
        <div class="controls">
          <button class="btn" onclick="initiateContact()"><i class="fas fa-satellite-dish"></i> Broadcast Translation Matrix</button>
        </div>
      </div>
      
      <div class="sim-container">
        <!-- Mycelial network background -->
        <div style="position: absolute; inset:0; background: url('data:image/svg+xml,%3Csvg width=\"100%\" height=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"%3E%3Cfilter id=\"n\"%3E%3CfeTurbulence type=\"fractalNoise\" baseFrequency=\"0.05\" numOctaves=\"3\" stitchTiles=\"stitch\"/%3E%3C/filter%3E%3Crect width=\"100%\" height=\"100%\" filter=\"url(%23n)\" opacity=\"0.2\" fill=\"%2314b8a6\"/%3E%3C/svg%3E'); pointer-events: none; z-index: 0; mix-blend-mode: overlay;"></div>
        
        <canvas id="mindCanvas" style="position: relative; z-index: 1;"></canvas>
        
        <div class="hud">
          <h3>Cognitive Telemetry</h3>
          <div class="metric"><span>Synaptic Sync:</span> <span class="val val-sync" id="syncVal">0%</span></div>
          <div class="metric"><span>Immune Aggression:</span> <span class="val val-aggro" id="aggroVal">0%</span></div>
          <div class="metric"><span>Translation Error:</span> <span class="val" id="errVal" style="color:#facc15">0</span></div>
          <div class="metric" style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 5px;">
            <span>Diplomatic State:</span> <span class="val" id="statusVal" style="color:#94a3b8">OBSERVING</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      let editor;
      require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@0.36.1/min/vs' }});
      require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('editor-container'), {
          value: `// Sentient Planetary Mind Interface
// The planet communicates via complex chemical and electromagnetic waves.
// You must translate human intent into the planet's neural syntax.
// Warning: Incorrect syntax triggers the planet's immune response (violent atmospheric storms).

function translateIntent(planetBrainwaveFreq, currentAggression) {
    // 'planetBrainwaveFreq' is a float [1.0 to 10.0].
    // Return { pulseFrequency: float, chemicalMarker: string }
    // To sync, pulseFrequency MUST perfectly harmonize (e.g., exactly half the planet's frequency).
    // chemicalMarker must be 'PEACE' if aggression > 50, otherwise 'GREETING'.
    
    // Naive logic: Yell hello at it!
    // Result: The planet thinks you are a virus and destroys you.
    return {
        pulseFrequency: 1.0,
        chemicalMarker: "HELLO"
    };
}`,
          language: 'javascript',
          theme: 'vs-dark',
          minimap: { enabled: false },
          automaticLayout: true
        });
      });

      const canvas = document.getElementById('mindCanvas');
      const ctx = canvas.getContext('2d');
      
      let isSimulating = false;
      let time = 0;
      
      let sync = 0;
      let aggression = 0;
      let brainwaveFreq = 5.0;
      let translationError = 0;
      
      let ourPulse = 0;
      let ourMarker = "";
      
      let nodes = [];
      
      function resize() { 
          canvas.width = canvas.clientWidth; 
          canvas.height = canvas.clientHeight;
          initNodes();
      }
      
      function initNodes() {
          nodes = [];
          for(let i=0; i<80; i++) {
              nodes.push({
                  x: Math.random() * canvas.width,
                  y: Math.random() * canvas.height,
                  baseOffset: Math.random() * Math.PI * 2
              });
          }
      }
      
      setTimeout(resize, 100);
      window.addEventListener('resize', resize);

      function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let cx = canvas.width / 2;
          let cy = canvas.height / 2;

          if (isSimulating) {
              time += 0.05;
              
              // Planet's shifting brainwave
              brainwaveFreq = 5.0 + Math.sin(time * 0.2) * 4.0; 
              
              ourPulse = 0;
              ourMarker = "";
              
              try {
                  eval(editor.getValue());
                  let res = translateIntent(brainwaveFreq, aggression);
                  if (res) {
                      ourPulse = res.pulseFrequency || 0;
                      ourMarker = res.chemicalMarker || "";
                  }
              } catch(e) {}
              
              // Evaluation
              let expectedPulse = brainwaveFreq / 2.0;
              translationError = Math.abs(expectedPulse - ourPulse);
              
              let expectedMarker = aggression > 50 ? "PEACE" : "GREETING";
              if (ourMarker !== expectedMarker) translationError += 2.0;
              
              if (translationError > 0.5) {
                  // Miscommunication!
                  aggression += translationError * 0.5;
                  sync -= 0.5;
              } else {
                  // Perfect sync
                  aggression -= 0.5;
                  sync += 0.2; // Slow to build trust
              }
              
              // Bounds
              if (sync < 0) sync = 0;
              if (sync > 100) sync = 100;
              if (aggression < 0) aggression = 0;
              
              // End States
              if (aggression > 100) {
                  aggression = 100;
                  isSimulating = false;
                  document.getElementById('statusVal').innerText = "IMMUNE PURGE ACTIVATED";
                  document.getElementById('statusVal').style.color = "#ef4444";
              } else if (sync >= 100) {
                  isSimulating = false;
                  document.getElementById('statusVal').innerText = "CONSCIOUSNESS MERGED";
                  document.getElementById('statusVal').style.color = "#10b981";
              } else {
                  if (aggression > 50) {
                      document.getElementById('statusVal').innerText = "PLANETARY ANGER DETECTED";
                      document.getElementById('statusVal').style.color = "#facc15";
                  } else {
                      document.getElementById('statusVal').innerText = "TRANSLATING...";
                      document.getElementById('statusVal').style.color = "#14b8a6";
                  }
              }
              
              // HUD
              document.getElementById('syncVal').innerText = sync.toFixed(1) + "%";
              document.getElementById('aggroVal').innerText = aggression.toFixed(1) + "%";
              document.getElementById('errVal').innerText = translationError.toFixed(2);
              
              let strEl = document.getElementById('aggroVal');
              if (aggression > 70) strEl.style.color = "#ef4444";
              else if (aggression > 40) strEl.style.color = "#facc15";
              else strEl.style.color = "#10b981";
          }
          
          // Render Planetary Mind (Neural Network Web)
          ctx.lineWidth = 1;
          for(let i=0; i<nodes.length; i++) {
              for(let j=i+1; j<nodes.length; j++) {
                  let n1 = nodes[i];
                  let n2 = nodes[j];
                  
                  // Move nodes slightly based on brainwave
                  let p1x = n1.x + Math.sin(time*brainwaveFreq*0.1 + n1.baseOffset)*10;
                  let p1y = n1.y + Math.cos(time*brainwaveFreq*0.1 + n1.baseOffset)*10;
                  let p2x = n2.x + Math.sin(time*brainwaveFreq*0.1 + n2.baseOffset)*10;
                  let p2y = n2.y + Math.cos(time*brainwaveFreq*0.1 + n2.baseOffset)*10;
                  
                  let dist = Math.sqrt(Math.pow(p1x-p2x, 2) + Math.pow(p1y-p2y, 2));
                  
                  if (dist < 150) {
                      // Color based on aggression vs sync
                      let r = Math.floor(aggression * 2.55);
                      let g = Math.floor((sync * 2.55) || (100 - aggression*0.5));
                      let b = 150;
                      
                      let alpha = 1.0 - (dist / 150);
                      ctx.strokeStyle = \`rgba(\${r}, \${g}, \${b}, \${alpha})\`;
                      ctx.beginPath();
                      ctx.moveTo(p1x, p1y);
                      ctx.lineTo(p2x, p2y);
                      ctx.stroke();
                  }
              }
          }
          
          // Draw "Our Signal" interacting with the core
          if (isSimulating) {
              ctx.shadowBlur = 20;
              ctx.shadowColor = translationError > 1.0 ? '#ef4444' : '#14b8a6';
              ctx.strokeStyle = translationError > 1.0 ? '#ef4444' : '#14b8a6';
              ctx.lineWidth = 3;
              
              ctx.beginPath();
              for(let i=0; i<canvas.width; i+=10) {
                  // Our pulse visualization
                  let y = cy + Math.sin(time * ourPulse + (i*0.05)) * 50;
                  if (i===0) ctx.moveTo(i, y);
                  else ctx.lineTo(i, y);
              }
              ctx.stroke();
              ctx.shadowBlur = 0;
              
              // Output marker text
              ctx.fillStyle = '#fff';
              ctx.font = '14px monospace';
              ctx.fillText("SIG: " + ourMarker, canvas.width - 120, canvas.height - 30);
          }

          requestAnimationFrame(animate);
      }
      
      animate();

      function initiateContact() {
          if(isSimulating) return;
          isSimulating = true;
          time = 0;
          sync = 0;
          aggression = 0;
          translationError = 0;
          
          document.getElementById('statusVal').innerText = "ESTABLISHING NEURAL LINK...";
          document.getElementById('statusVal').style.color = "#14b8a6";
      }
    </script>
  </body>
</html>
